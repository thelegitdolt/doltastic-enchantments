modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/thelegitdolt/doltastic_enchantments/issues"
license = "https://github.com/thelegitdolt/doltastic_enchantments/license"

[[mods]]
modId = "doltastic_enchantments"
version = "${file.jarVersion}"
authors = "Dolt"
credits = "Dolt H. Haven"
displayName = "Doltastic Enchantments"
description = '''
    Addon for Immersive Enchanting mod which does things to my vision
'''

[[dependencies.doltastic_enchantments]]
    modId = "blueprint"
    mandatory = true
    versionRange = "[7.1.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.doltastic_enchantments]]
    modId = "immersiveenchanting"
    mandatory = true
    versionRange = "[5.0.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.doltastic_enchantments]]
    modId = "emi"
    mandatory = false
    versionRange = "[1.1.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.doltastic_enchantments]]
    modId = "reliable_remover"
    mandatory = false
    versionRange = "[2.0.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config="doltastic_enchantments.mixins.json"

[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"

